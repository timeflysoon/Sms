name: Build and publish

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set Up Java
        uses: actions/setup-java@v6.0.0
        with:
          distribution: "oracle"
          cache: 'gradle'
          java-version: "17"

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: "stable"
          cache: true

      - name: Setup Android SDK Platform 37
        # compileSdk=37 需要 android-37 目录，但 sdkmanager 只提供版本化目录（如 android-37.1），故安装后做软链。
        # yes 在 sdkmanager 退出后写 stdin 会收 SIGPIPE，在 pipefail 下导致整步失败，用 || true 忽略（安装本身不受影响）。
        run: |
          if [ ! -d "$ANDROID_HOME/platforms/android-37.1" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.1" "build-tools;37.0.0" || true
          fi
          ln -sfn "$ANDROID_HOME/platforms/android-37.1" "$ANDROID_HOME/platforms/android-37"
          ls "$ANDROID_HOME/platforms"
        shell: bash

      - name: Install Dependencies
        run: flutter pub get
        shell: bash

      - name: Install flutter_distributor
        run: dart pub global activate flutter_distributor
        shell: bash

      - name: Build APK
        run: flutter_distributor release --name apk
        shell: bash

      - name: Release APK
        uses: softprops/action-gh-release@v3.0.3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/**
          draft: true
          token: ${{ secrets.SMS_RELEASE }}

      - name: Archive APK
        uses: actions/upload-artifact@v7.0.1
        with:
          name: sms
          path: |
            dist/**
          overwrite: true
          compression-level: 9
          retention-days: 2
